[plugin]
enabled = false
config_version = "0.2.0"
admin_qq = []

# ===== 锚定层（手动配置，运行时只读） =====
# 人设主体复用主程序原生配置 config/bot_config.toml 的 [personality] 段
# （personality 身份白描 / behavior_style 行为准则 / reply_style 说话风格）。
# 本段只填原生三段没有的维度（性格/语气/etc.一律写原生，勿在本段重复定义）：
[identity]
world = ""
values = []
world_rules = []
# 禁用片段：世界/价值观/规则的浓缩片段（人物代号、专属称呼、指认性表述）。
# 产出文本或注入文本命中即拦下。不填 = 只从上面两行自动抽取。
guard_fragments = []

# ===== 锚定护栏（ADR-0002 §9） =====
# 锚定层内容在 [identity] 与宿主 [personality]；本段只管护栏行为。
[anchor]
# 启动期「宿主 personality vs 插件 world/values」LLM 一次性一致性比对，
# 不一致仅 WARN 不阻断。默认关：启动期同步 LLM 调用慢/失败会拖垮启动。
consistency_check = false
# 关键词守卫总开关（2026-10-09 裁定，登记表 R30）：false = 双向守卫（入库前 +
# 注入前）整体禁用，不拦任何产出。原因：关键词子串匹配误判风险高（中文无词边界、
# 关键词集合只增不减），误判代价 = 丢弃整条产出；借鉴源 HDSI 的 validateScriptCommit
# 实为纯结构校验（散文非空/事件 id 唯一/因果引用存在性），当初误读为「关键词过滤」。
# 待功能测试完整后再评估修改、废弃或删除。
guard_check = false
# 双向守卫（入库前 + 注入前）的手工补充关键词；自动部分已含 world_rules/values。
# ⚠️ 仅在 guard_check = true 时生效。
guard_keywords = []

# ===== 剧本模式与世界引擎 =====
[narrative]
enabled = false
# v0.1 最小切片：只填你自己的 QQ 号（私聊剧本模式）
mode_user_ids = []
mode_stream_ids = []
# R35 群聊观察：参与观察的群号列表（留空 = 群聊观察整体关闭）
# ⚠️ 落库事件强制打 g:<群号> 受众标；取不到群号的消息一律拒绝落库
observe_group_ids = []
# 群聊观察事件保留天数（超期由 tick 清理）
group_event_retention_days = 60
# 世界时钟 tick 间隔（分钟）。⚠️ 有效值 30-240，小于 30 会按 30 计
clock_tick_minutes = 30
# 时区偏移（UTC+）。⚠️ 服务器系统时区为 UTC 时本项无效，请直接改服务器系统时区
timezone_offset_hours = 8
chronicle_enabled = true
daily_chronicle_time = "23:30"
# 精力规则（v0.1.5）：修复无互动日 mood 贴地卡死；A/B 期间可调
# baseline=精力基线；pull=每 tick 向基线回归系数（0=老版单调衰减行为）；
# sleep_recovery=深夜每 tick 恢复量（睡觉回血，深夜平衡点≈基线+恢复量/pull≈0.78 轻快档）；
# interaction_boost=2h 内互动每 tick 提振
energy_baseline = 0.45
energy_baseline_pull = 0.3
energy_sleep_recovery = 0.1
energy_interaction_boost = 0.12
# 创作层：生活片段生成间隔（分钟）与每日上限
# ⚠️ 两者必须配套看：启用睡眠态后清醒窗口约 16.5h（07:00-23:30），
#    间隔 120 时理论产能只有 8 条，日上限填 16 也吃不到 → 必须降到 60。
#    另：实际间隔会被向上取整到 tick(30min) 的整数倍，填 45 等同 60。
# 2026-09-21：240 → 120；2026-09-22：120 → 60（配合日上限 16）。
life_fragment_interval_minutes = 60
life_fragment_daily_max = 16
# 高光签总开关（2026-09-30 语义换轨，原名保留）：开启后每次正常片段生成前以
# highlight_probability 抽签；抽中则追加「写一件不寻常的小事」的要求。篇幅随真实
# 发生的事自然形成，不再有字数档（minor/normal/major 三档已随 P1/R22 废止）。
life_fragment_detail_enabled = true
# 高光签抽中概率（P19）；起床片段豁免抽签。⚠️ 观察期冻结：改动＝污染实验
highlight_probability = 0.12
# 生活素材池容量（P20）：pending_events 保留条数；由头取材窗口与容量同宽，
# 对话注入端仍只取最近 2 条（注入是常驻 token 成本，由头是一次性）
fragment_pending_max = 12

# ── 睡眠态（v0.1.10）────────────────────────────────────────────
# 真源：本段这三项就是 bot 的作息，自我层 state 里不再存同名键（v0.1 遗留的死字段已删）。
# 睡眠中的行为：停止生成生活片段 · 不主动开口 · 每 tick 回精力。
# 深夜收到消息 → 「被吵醒」（瞬时：不改状态，只是这一轮迷糊 + 扣精力）。
# ⚠️ sleep_time 留空 = 关闭整个睡眠态，回 v0.1.9 及以前的全天不睡行为。
sleep_time = "23:30"
wake_time = "07:00"
# 到 sleep_time 时若仍在聊天（最近一次互动在 10 分钟内）→ 推迟入睡，最多推迟 60 分钟
sleep_delay_max_minutes = 60
sleep_delay_recent_minutes = 10
# 被吵醒后的持续时间：这段时间内注入「被吵醒」提示、且不享受睡眠回精力；到期自动回落
woken_awake_minutes = 30
# 被吵醒一次扣 0.08 精力，一夜多次叠加，但不低于地板 0.3
energy_woken_penalty = 0.08
energy_woken_floor = 0.3
# 起床补一段（豁免间隔闸门与日上限）：否则早上所有用户拿到的由头都是昨晚睡前那一条
wake_fragment_enabled = true
# 距入睡不足 25 分钟时，对话注入追加「你有点困了」；0=关闭
sleep_pre_sleep_hint_minutes = 25

# ===== 主动消息 =====
[proactive]
enabled = false
silent_start = "23:00"
silent_end = "08:00"
random_minutes = [60, 240]
daily_max = 2
default_active_window = ["09:00-22:00"]
# ── 分享欲 share_urge（v0.1.8 第一步：动机驱动时机，规则层零 LLM） ──
# 随机计时器只作"最小间隔闸门"，到点后按分享欲采样决定是否真的开口；
# 用户主动来找时回复路径绝不设门。
urge_enabled = true
# self 层基线分享欲：无事件时每 tick 向该值回归（双向）
urge_base = 0.7
# 正反馈步长：主动消息被接住 +1×该值；用户主动发起对话 +0.5×该值
urge_gain = 0.1
# 负反馈步长：主动消息在承接窗口（16 小时，代码常量）内无人接住时每条 -该值
urge_decay = 0.25
# 基线回归系数：每 tick 分享欲向基线靠拢的比例
urge_regain = 0.15
# branch 层对人系数下限：长期被冷落也不会低于该值（防彻底饿死）
urge_branch_floor = 0.4
# branch 层回归系数（沉默螺旋修复）：每 tick 对人系数向中性 1.0 靠拢——
# 修复前 branch 层只降不升，约 3 次冷落触地板后永不回升（结构性沉默根因）
urge_branch_regain = 0.05

# 回忆里程碑（方案 §6 / Q4）：主动消息被接住后若真的聊起来（1 小时窗内 ≥3 条且
# ≥30 字，取且），落一条用户原话回忆供日后当由头。关闭＝回忆恒空、回到改造前。
# ⚠️ 本开关只管写入；三闸（7 天冷却 / 30 天保质 / 3 选 1）是代码常量，观察期冻结。
milestone_enabled = true

# 跨用户签发冷却（P4 / R44，v0.3.0 批 2）：同一事件/片段 T 小时内只签给 1 人，
# 治同片段同时段多人群发。⚠️ 不构成生活线分叉/素材隔离——只限时间窗内的
# 签发人数，素材内容不改、生活线仍单条。
sign_cooldown_hours = 6

# 由头进回复指令位（R39，v0.3.0 批 4，需宿主 ≥1.3.5 的 REPLY_EXTENSION 通道）：
# 开启后主动消息的 reason 会教模型在 reply 调用里选择本插件的回复扩展，由头
# 随即出现在「【额外回复要求】」块。建议先积累几天回执基线（receipt_catch）再开。
reply_extension_enabled = false

# 按用户窗口规则（覆盖默认窗口）：一条规则 = QQ 号 × 生效星期 × 时段
#   星期记法（ISO）：1=周一 2=周二 3=周三 4=周四 5=周五 6=周六 7=周日
#   某 QQ 只要有规则，就**只**按规则走，不再使用 default_active_window
#   星期全部留空（days = []）= 对该用户永不主动
#   同一 QQ 可写多条（工作日一条 + 周末一条），任一条命中即开口
#   注意：仍受全局静默期 silent_start/end 约束（两者取交集）
#
# 例：工作日只在 20:20~次日 05:00 开口，周末 09:00~22:00 照常
# [[proactive.user_window_rules]]
# user_id = "3892809830"
# days = ["1", "2", "3", "4", "5"]
# start = "20:20"
# end = "05:00"
#
# [[proactive.user_window_rules]]
# user_id = "3892809830"
# days = ["6", "7"]
# start = "09:00"
# end = "22:00"

# ===== 模型路由（按模型名调用已注册模型，MaiBot ≥1.2.5） =====
[llm]
# 创作模型名：须与主程序已注册的模型名完全一致（WebUI 模型列表可查看复制）；
# 只填模型名、无需分配给任何任务。留空 = 使用主程序默认模型。
# 推理模型可在 WebUI 该模型的 extra_params 配 {thinking = {type = "disabled"}} 关思考。
creation_model = ""
temperature = 0.9
# 最大输出 token：只作防失控天花板，不参与「要求」（写多长由事件本身决定）
creation_max_tokens = 1024
show_prompt = false

# ===== 验收采样 =====
[telemetry]
enabled = true

# ===== 世界书（v0.3.0 批 1 / R43）=====
# 她的世界的结构化知识基座——「她的世界有什么」（[identity] 管「她是谁、底线是什么」）。
# 文件：data/narrative/lorebook.toml 手编（mtime 热重载，模板见 examples/lorebook.example.toml）；
# 条目三类：world=世界设定（可常驻）/ cast=NPC 名册（播种器取材面）/ entry=关键词触发。
# 双模式：simple=世界书不读（[identity].world 照旧注入）；detailed=世界书接管世界观，
# [identity].world 不再注入——values/world_rules 铁律两种模式都注入、不动。
[lorebook]
enabled = false
mode = "simple"
file = "lorebook.toml"
# 命中条目的累计注入预算（字符）：constant 优先 → high 优先 → 文件序，超预算整条丢弃
inject_budget_chars = 800
# 条目数软上限：超出打 WARNING 不阻断、不截断（防手滑写崩）
max_entries = 100

# ===== 世界事件播种器（v0.3.0 批 2 / R40）=====
# 独立题材源：周期低概率生成「她的世界里正在发生的小事」（事实权威、反应自由），
# 进由头池带「外面发生的一件事：」前缀、origin=seed 可单独度量兑现回执。
# 🔴 参与者禁入双层红线：生成 prompt 明示禁止涉及真实用户 + 落库前词面拦截
# （模式用户号/已知会话号/群号/手工网名表），命中整条丢弃、不占每日配额。
# 建议先填好世界书的世界基调与 NPC 名册再开启。
[seeder]
enabled = false
# 两次播种尝试的最小间隔（分钟）；probability=每次尝试的实际播种概率（期望每天 1~2 条起步）
interval_minutes = 240
probability = 0.5
daily_max = 2
# 参与者拦截补充词表：模式用户与已知会话/群号之外的网名/昵称/称呼
blocked_names = []

# ===== 建议通道（v0.3.0 批 3 / R42）=====
# 社交层 → 生活层唯一入口：网友建议经语义路由（须命中建议句式且挂靠某条待办事件）
# 写入事件实体的 suggestions 字段，生活片段生成时作「倾向」参考——不是指令，bot 可
# 任性不听；消费时匿名化（「有网友建议」）。与对话素材回声池两池分离；群聊永不路由。
[suggestion]
enabled = false

# ===== 慢变晋升机（批 4）=====
# 本段只控制**晋升行为**，不承载学习成果（`[learned]` 刻意不声明进 config.py，
# 见下方注释与 ADR-0002 决策 6）。
# ⚠️ 关系晋升的证据源是 metrics/*.csv（用户主动发起 + 主动消息承接），受
#    [telemetry].enabled 与 [plugin].enabled **双门控**：关掉验收采样 = 关掉关系
#    晋升的证据源（刻意取舍：不为此另建事件表）。读到 0 条时会打一条 WARN 提示。
[promotion]
enabled = true
# 冷启动 seed：首次上线从锚定层 world/values 派生 world_view/life_goals 初值作基线
seed_on_start = true
# 提案提炼间隔（小时）：168 = 周度
interval_hours = 168
# 提炼失败后的退避（小时）；**重启后必再试一次**（失败指纹不持久化）
failure_backoff_hours = 6
# 输入充分性：证据条目少于此值直接不调 LLM
min_evidence_entries = 5
# 单次提炼最多采纳的提案条数
max_proposals = 8

# ── 晋升门槛（P3/P4/P6/P7，回放台定标；初值抄 HDSI 3.1）──
# minor：置信 ≥0.82 且 场景 ≥3 且 跨日 ≥2 且 未冷却
minor_confidence = 0.82
minor_min_scenes = 3
minor_min_days = 2
# 同路径晋升冷却（小时），跨重启持久化
cooldown_hours = 72
# major：置信 ≥0.95 且 场景 ≥2，默认关
major_enabled = false
major_confidence = 0.95
major_min_scenes = 2
# 反证命中扣减的置信
refutation_penalty = 0.2
# 重复提案合并的信度加成（仅新独立场景才加）
merge_bonus = 0.05

# ── 关系确定性晋升（E14）──
# 正向场景日 =「用户主动发起」∪「主动消息被承接」按自然日去重
# 起步 3 日；每新增 2 日 +0.05；上限 0.8（留余量给批 5 的 LLM 提案与人工）
# ⚠️ boundaries 维度**不参与**自动晋升（计数推不出「抗议/舒适」的交互质量）
relation_min_days = 3
relation_days_per_step = 2
relation_step = 0.05
relation_max = 0.8

# ── 读取端限流（R28）──
# 注入的慢变软倾向最多几条（按相关度排序）
projection_limit = 2

# ===== 学习层投影（批 3-C2 / ADR-0002 决策 6）=====
# ⚠️ 本段**刻意不声明进 config.py**（不进 WebUI 表单）：一旦进表单，用户保存任一配置时
#    表单会以 stale 值整体回写，冲掉批 4 写入的学习成果——这正是当初预判并规避的事故链。
#    读写只走 tomlkit 直通（services/learning/projection.py），展示走 /narrative status。
#    事实源在 db；本段只是呈现层投影，损坏可从 db 重建。
# style：二期 LLM 风格提炼的投影槽（v1 恒空，待批 4 晋升机写入）。   # RESERVED(R1)
[learned]
style = []
