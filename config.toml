[plugin]
enabled = false
config_version = "0.2.0"
admin_qq = []

# ===== 锚定层（手动配置，运行时只读） =====
# 人设主体复用主程序原生配置 config/bot_config.toml 的 [personality] 段
# （personality 身份白描 / behavior_style 行为准则 / reply_style 说话风格）。
# 本段只填原生三段没有的维度（性格/语气/etc.一律写原生，勿在本段重复定义）：
[identity]
world = ""
values = []
world_rules = []
# 禁用片段：世界/价值观/规则的浓缩片段（人物代号、专属称呼、指认性表述）。
# 产出文本或注入文本命中即拦下。不填 = 只从上面两行自动抽取。
guard_fragments = []

# ===== 锚定护栏（ADR-0002 §9） =====
# 锚定层内容在 [identity] 与宿主 [personality]；本段只管护栏行为。
[anchor]
# 启动期「宿主 personality vs 插件 world/values」LLM 一次性一致性比对，
# 不一致仅 WARN 不阻断。默认关：启动期同步 LLM 调用慢/失败会拖垮启动。
consistency_check = false
# 双向守卫（入库前 + 注入前）的手工补充关键词；自动部分已含 world_rules/values。
guard_keywords = []

# ===== 剧本模式与世界引擎 =====
[narrative]
enabled = false
# v0.1 最小切片：只填你自己的 QQ 号（私聊剧本模式）
mode_user_ids = []
mode_stream_ids = []
# 世界时钟 tick 间隔（分钟）。⚠️ 有效值 30-240，小于 30 会按 30 计
clock_tick_minutes = 30
# 时区偏移（UTC+）。⚠️ 服务器系统时区为 UTC 时本项无效，请直接改服务器系统时区
timezone_offset_hours = 8
chronicle_enabled = true
daily_chronicle_time = "23:30"
# 精力规则（v0.1.5）：修复无互动日 mood 贴地卡死；A/B 期间可调
# baseline=精力基线；pull=每 tick 向基线回归系数（0=老版单调衰减行为）；
# sleep_recovery=深夜每 tick 恢复量（睡觉回血，深夜平衡点≈基线+恢复量/pull≈0.78 轻快档）；
# interaction_boost=2h 内互动每 tick 提振
energy_baseline = 0.45
energy_baseline_pull = 0.3
energy_sleep_recovery = 0.1
energy_interaction_boost = 0.12
# 创作层：生活片段生成间隔（分钟）与每日上限
# ⚠️ 两者必须配套看：启用睡眠态后清醒窗口约 16.5h（07:00-23:30），
#    间隔 120 时理论产能只有 8 条，日上限填 16 也吃不到 → 必须降到 60。
#    另：实际间隔会被向上取整到 tick(30min) 的整数倍，填 45 等同 60。
# 2026-09-21：240 → 120；2026-09-22：120 → 60（配合日上限 16）。
life_fragment_interval_minutes = 60
life_fragment_daily_max = 16
# 按事件重要度分级创作详略：minor 40~90 / normal 80~180 / major 200~400 字。
# 命中信号：窗口内新增关系里程碑 · energy 极端 · 窗口内对话素材 ≥4 条。关=回旧行为（统一 40~90 字）。
life_fragment_detail_enabled = true

# ── 睡眠态（v0.1.10）────────────────────────────────────────────
# 真源：本段这三项就是 bot 的作息，自我层 state 里不再存同名键（v0.1 遗留的死字段已删）。
# 睡眠中的行为：停止生成生活片段 · 不主动开口 · 每 tick 回精力。
# 深夜收到消息 → 「被吵醒」（瞬时：不改状态，只是这一轮迷糊 + 扣精力）。
# ⚠️ sleep_time 留空 = 关闭整个睡眠态，回 v0.1.9 及以前的全天不睡行为。
sleep_time = "23:30"
wake_time = "07:00"
# 到 sleep_time 时若仍在聊天（最近一次互动在 10 分钟内）→ 推迟入睡，最多推迟 60 分钟
sleep_delay_max_minutes = 60
sleep_delay_recent_minutes = 10
# 被吵醒后的持续时间：这段时间内注入「被吵醒」提示、且不享受睡眠回精力；到期自动回落
woken_awake_minutes = 30
# 被吵醒一次扣 0.08 精力，一夜多次叠加，但不低于地板 0.3
energy_woken_penalty = 0.08
energy_woken_floor = 0.3
# 起床补一段（豁免间隔闸门与日上限）：否则早上所有用户拿到的由头都是昨晚睡前那一条
wake_fragment_enabled = true
# 距入睡不足 25 分钟时，对话注入追加「你有点困了」；0=关闭
sleep_pre_sleep_hint_minutes = 25

# ===== 主动消息 =====
[proactive]
enabled = false
silent_start = "23:00"
silent_end = "08:00"
random_minutes = [60, 240]
daily_max = 2
default_active_window = ["09:00-22:00"]

# 按用户窗口规则（覆盖默认窗口）：一条规则 = QQ 号 × 生效星期 × 时段
#   星期记法（ISO）：1=周一 2=周二 3=周三 4=周四 5=周五 6=周六 7=周日
#   某 QQ 只要有规则，就**只**按规则走，不再使用 default_active_window
#   星期全部留空（days = []）= 对该用户永不主动
#   同一 QQ 可写多条（工作日一条 + 周末一条），任一条命中即开口
#   注意：仍受全局静默期 silent_start/end 约束（两者取交集）
#
# 例：工作日只在 20:20~次日 05:00 开口，周末 09:00~22:00 照常
# [[proactive.user_window_rules]]
# user_id = "3892809830"
# days = ["1", "2", "3", "4", "5"]
# start = "20:20"
# end = "05:00"
#
# [[proactive.user_window_rules]]
# user_id = "3892809830"
# days = ["6", "7"]
# start = "09:00"
# end = "22:00"

# ===== 模型路由（按模型名调用已注册模型，MaiBot ≥1.2.5） =====
[llm]
# 创作模型名：须与主程序已注册的模型名完全一致（WebUI 模型列表可查看复制）；
# 只填模型名、无需分配给任何任务。留空 = 使用主程序默认模型。
# 推理模型可在 WebUI 该模型的 extra_params 配 {thinking = {type = "disabled"}} 关思考。
creation_model = ""
temperature = 0.9
# 最大输出 token：生活片段 major 档可达 400 字，1024 是防截断天花板
creation_max_tokens = 1024
show_prompt = false

# ===== 验收采样 =====
[telemetry]
enabled = true

# ===== 慢变晋升机（批 4）=====
# 本段只控制**晋升行为**，不承载学习成果（`[learned]` 刻意不声明进 config.py，
# 见下方注释与 ADR-0002 决策 6）。
# ⚠️ 关系晋升的证据源是 metrics/*.csv（用户主动发起 + 主动消息承接），受
#    [telemetry].enabled 与 [plugin].enabled **双门控**：关掉验收采样 = 关掉关系
#    晋升的证据源（刻意取舍：不为此另建事件表）。读到 0 条时会打一条 WARN 提示。
[promotion]
enabled = true
# 冷启动 seed：首次上线从锚定层 world/values 派生 world_view/life_goals 初值作基线
seed_on_start = true
# 提案提炼间隔（小时）：168 = 周度
interval_hours = 168
# 提炼失败后的退避（小时）；**重启后必再试一次**（失败指纹不持久化）
failure_backoff_hours = 6
# 输入充分性：证据条目少于此值直接不调 LLM
min_evidence_entries = 5
# 单次提炼最多采纳的提案条数
max_proposals = 8

# ── 晋升门槛（P3/P4/P6/P7，回放台定标；初值抄 HDSI 3.1）──
# minor：置信 ≥0.82 且 场景 ≥3 且 跨日 ≥2 且 未冷却
minor_confidence = 0.82
minor_min_scenes = 3
minor_min_days = 2
# 同路径晋升冷却（小时），跨重启持久化
cooldown_hours = 72
# major：置信 ≥0.95 且 场景 ≥2，默认关
major_enabled = false
major_confidence = 0.95
major_min_scenes = 2
# 反证命中扣减的置信
refutation_penalty = 0.2
# 重复提案合并的信度加成（仅新独立场景才加）
merge_bonus = 0.05

# ── 关系确定性晋升（E14）──
# 正向场景日 =「用户主动发起」∪「主动消息被承接」按自然日去重
# 起步 3 日；每新增 2 日 +0.05；上限 0.8（留余量给批 5 的 LLM 提案与人工）
# ⚠️ boundaries 维度**不参与**自动晋升（计数推不出「抗议/舒适」的交互质量）
relation_min_days = 3
relation_days_per_step = 2
relation_step = 0.05
relation_max = 0.8

# ── 读取端限流（R28）──
# 注入的慢变软倾向最多几条（按相关度排序）
projection_limit = 2

# ===== 学习层投影（批 3-C2 / ADR-0002 决策 6）=====
# ⚠️ 本段**刻意不声明进 config.py**（不进 WebUI 表单）：一旦进表单，用户保存任一配置时
#    表单会以 stale 值整体回写，冲掉批 4 写入的学习成果——这正是当初预判并规避的事故链。
#    读写只走 tomlkit 直通（services/learning/projection.py），展示走 /narrative status。
#    事实源在 db；本段只是呈现层投影，损坏可从 db 重建。
# style：二期 LLM 风格提炼的投影槽（v1 恒空，待批 4 晋升机写入）。   # RESERVED(R1)
[learned]
style = []
