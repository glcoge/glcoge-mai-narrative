[plugin]
enabled = false
config_version = "0.1.3"
admin_qq = []

# ===== 锚定层（手动配置，运行时只读） =====
# 人设主体复用主程序原生配置 config/bot_config.toml 的 [personality] 段
# （personality 身份白描 / behavior_style 行为准则 / reply_style 说话风格）。
# 本段只填原生三段没有的维度（性格/语气/etc.一律写原生，勿在本段重复定义）：
[identity]
world = ""
values = []
world_rules = []

# ===== 剧本模式与世界引擎 =====
[narrative]
enabled = false
# v0.1 最小切片：只填你自己的 QQ 号（私聊剧本模式）
mode_user_ids = []
mode_stream_ids = []
clock_tick_minutes = 30
timezone_offset_hours = 8
event_max_daily = 6
event_max_per_user_daily = 3
chronicle_enabled = true
daily_chronicle_time = "23:30"
# 创作层：生活片段生成间隔（分钟）与每日上限（防超支，遵守成本 30% 红线）
life_fragment_interval_minutes = 240
life_fragment_daily_max = 3

# ===== 主动消息 =====
[proactive]
enabled = false
silent_start = "23:00"
silent_end = "08:00"
random_minutes = [60, 240]
daily_max = 2
default_active_window = ["09:00-22:00"]
user_active_windows = {}

# ===== 模型路由（复用 MaiBot 内部 task） =====
[llm]
creation_task = "learner"
temperature = 0.9
show_prompt = false

# ===== 创作模型直连（可选；启用后绕过 MaiBot 任务路由，直接 POST 到 base_url）=====
# 用途：推理模型（如 Mimo V2.5）不禁思考会挤占 max_tokens 导致正文截断；
# 直连请求 body 固定携带 thinking={type:"disabled"}，生成短文本无需思维链。
# 留空/关闭 = 回退 [llm] creation_task 路由。
[creator_model]
enabled = false
base_url = ""
api_key = ""
model_id = ""
max_tokens = 384
timeout_seconds = 30.0

# ===== 验收采样 =====
[telemetry]
enabled = true